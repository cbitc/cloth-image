# 受控材质词表（taxonomy）
# 用途：
#   1) 测试用 fake 材质识别从中确定性抽取 tag
#   2) 材质图检索用 keywords 构造 query
#   3) 真实 VLM 识别时作为「可选标签集合」注入 prompt，保证 tag 可直接用于检索
#
# 字段：material 中文名 / material_en 英文名 / category 分类 /
#       gloss 光泽（低|中|高） / drape 垂坠（低|中|高） / keywords 检索词（中英）

